[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @workspace/api-server run build"
watchPatterns = [
  "/artifacts/artifacts/api-server/**",
  "/lib/lib/api-zod/**",
  "/lib/lib/db/**",
  "/lib/lib/api-spec/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml"
]

[deploy]
startCommand = "pnpm --filter @workspace/api-server run start"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10