[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @workspace/webmail run build"
watchPatterns = [
  "/artifacts/artifacts/webmail/**",
  "/lib/lib/api-client-react/**",
  "/lib/lib/api-spec/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml"
]

[deploy]
startCommand = "pnpm --filter @workspace/webmail run start"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10